<!-- Task 4 : In a container where ever user is clicking draw a circle around it -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 5px;
            display: inline-block;
        }

        .outputContainer {
            width: 100%;
            height: 500px;
            background-color: beige;
            margin: 10px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="container my-3">
        <div class="row">
            <div class="col-12">
                <h2>Task 4 : In a container where ever user is clicking draw a circle around it</h2>
            </div>
            <div class="outputContainer" id="outputWindow">

            </div>
        </div>
    </div>
    <script>
        var outputWindow = document.querySelector("#outputWindow");

        outputWindow.addEventListener("click", (e) => {
            outputWindow.innerHTML = "";
            console.log(e);

            var circle =document.createElement("div");
            circle.style.position = "absolute";
            circle.style.left = `${e['clientX']}px`;
            circle.style.top = `${e['clientY']}px`;
            circle.style.height = "150px";
            circle.style.width = "150px";
            circle.style.borderRadius = "50%";
            circle.style.backgroundColor = "black"
            circle.style.transform = 'translate(-50%, -50%)';
            outputWindow.appendChild(circle);

        })

    </script>
</body>

</html>
