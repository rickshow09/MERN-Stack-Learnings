<!-- Task 1 : Take a number as input from user and on a click of generate btn generate those number of circles  -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: beige;
            margin: 5px;
            display: inline-block;
        }

        .outputContainer {
            width: 100%;
            height: 500px;
            background-color: black;
            margin: 10px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="container my-3">
        <div class="row">
            <div class="col-12">
                <h2>Task 1 : Take a number as input from user and on a click of generate btn generate those number of
                    circles</h2>
            </div>
            <div class="col-4">
                <input type="text" id="userInput" class="form-control"
                    placeholder="Please enter number of circles you want to print">
            </div>
            <div class="col-2">
                <button type="button" class="btn btn-primary" id="btnGenerate">Generate Circles</button>
            </div>
            <div class="outputContainer" id="outputWindow">

            </div>
        </div>
    </div>
    <script>

        document.querySelector("#btnGenerate").addEventListener("click", () => {
            var count = document.querySelector("#userInput").value;
            document.querySelector("#outputWindow").innerHTML = "";
            for (let index = 0; index < count; index++) {
                var circle = document.createElement("div");
                circle.classList.add("circle");
                document.querySelector("#outputWindow").appendChild(circle);
            }
        })
    </script>
</body>

</html>
