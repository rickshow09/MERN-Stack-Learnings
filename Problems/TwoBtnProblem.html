<!-- Forming Closures Example -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Button Problems</title>
</head>

<body>
    <button id="red">Red</button>
    <button id="green">Green</button>

    <script>
        const red = document.getElementById('red').onclick = handleEvent('red');
        const green = document.getElementById('green').onclick = handleEvent('green');

        function handleEvent(color) {
            return function () {
                document.body.style.backgroundColor = color;
            }
        }

    </script>
</body>

</html>
